<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artirealis</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      width: 100%;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Didact Gothic', 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
    }
    body { overflow-x: hidden; }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 1.8s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    svg {
      width: min(340px, 80vw);
      height: auto;
    }
    .mark-line {
      stroke-dasharray: 300;
      stroke-dashoffset: 300;
      animation: draw 1.4s cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards;
    }
    .mark-dot {
      opacity: 0;
      animation: dotIn 0.4s ease 1.8s forwards;
    }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes dotIn {
      to { opacity: 1; }
    }
    .wordmark {
      opacity: 0;
      animation: fadeIn 1s ease 1.6s forwards;
    }
    .tagline {
      opacity: 0;
      animation: fadeIn 1s ease 2s forwards;
    }

    /* Contact link */
    .contact-link {
      display: block;
      margin-top: 2.5rem;
      color: #C41E1E;
      opacity: 0;
      text-decoration: none;
      font-size: 9px;
      letter-spacing: 4px;
      text-align: center;
      cursor: pointer;
      transition: opacity 0.3s ease;
      animation: fadeInLink 1s ease 2.4s forwards;
      background: none;
      border: none;
      font-family: inherit;
    }
    .contact-link:hover { opacity: 1 !important; }
    @keyframes fadeInLink {
      to { opacity: 0.45; }
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(10, 10, 10, 0.92);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      padding: 1.5rem;
      animation: fadeIn 0.3s ease forwards;
    }
    .modal-overlay[hidden] { display: none; }
    .modal-content {
      background: #0a0a0a;
      border: 1px solid rgba(196, 30, 30, 0.4);
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      position: relative;
      color: #C41E1E;
    }
    .modal-close {
      position: absolute; top: 0.75rem; right: 1rem;
      background: none; border: none;
      color: #C41E1E;
      font-size: 1.5rem; cursor: pointer;
      line-height: 1;
      opacity: 0.6;
      transition: opacity 0.2s ease;
    }
    .modal-close:hover { opacity: 1; }
    .modal-content h2 {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 6px;
      text-align: center;
      margin-bottom: 2rem;
      text-transform: uppercase;
    }
    #contact-form label {
      display: block;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.6;
      margin-top: 1.25rem;
      margin-bottom: 0.4rem;
    }
    #contact-form input,
    #contact-form textarea {
      width: 100%;
      padding: 0.5rem 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(196, 30, 30, 0.3);
      color: #C41E1E;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    #contact-form input:focus,
    #contact-form textarea:focus {
      border-bottom-color: #C41E1E;
    }
    #contact-form textarea {
      resize: vertical;
      min-height: 80px;
    }
    #contact-form button {
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      background: transparent;
      border: 1px solid #C41E1E;
      color: #C41E1E;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      width: 100%;
    }
    #contact-form button:hover:not(:disabled) {
      background: #C41E1E;
      color: #0a0a0a;
    }
    #contact-form button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #thank-you {
      text-align: center;
      padding: 1.5rem 0;
    }
    #thank-you h2 { margin-bottom: 0.75rem; }
    #thank-you p {
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.6;
    }
    .honeypot { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <svg viewBox="0 0 340 230" xmlns="http://www.w3.org/2000/svg">
      <!-- Triangle mark -->
      <polygon
        class="mark-line"
        points="170,28 226,128 114,128"
        fill="none"
        stroke="#C41E1E"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
      <!-- Crossbar -->
      <line
        class="mark-line"
        x1="137" y1="96"
        x2="203" y2="96"
        stroke="#C41E1E"
        stroke-width="1.5"
      />
      <!-- Peak dot -->
      <circle
        class="mark-dot"
        cx="170" cy="27"
        r="2.5"
        fill="#C41E1E"
      />
      <!-- Wordmark -->
      <text
        class="wordmark"
        x="170" y="168"
        text-anchor="middle"
        font-family="'Didact Gothic', 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif"
        font-size="22"
        font-weight="400"
        letter-spacing="8"
        fill="#C41E1E"
      >ARTIREALIS</text>
      <!-- Tagline -->
      <text
        class="tagline"
        x="170" y="194"
        text-anchor="middle"
        font-family="'Didact Gothic', 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif"
        font-size="7.5"
        font-weight="400"
        letter-spacing="4"
        fill="#C41E1E"
        opacity="0.45"
      >MAKE YOUR OWN REALITY</text>
    </svg>

    <button type="button" id="contact-trigger" class="contact-link">BUSINESS INQUIRIES</button>
  </div>

  <!-- Modal -->
  <div id="contact-modal" class="modal-overlay" hidden>
    <div class="modal-content" role="dialog" aria-labelledby="modal-title" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>

      <div id="form-container">
        <h2 id="modal-title">Get in touch</h2>
        <form id="contact-form">
          <input type="hidden" name="access_key" value="f7a10a32-cfc2-4fb1-9206-7a4b72cf8c7a">
          <input type="hidden" name="subject" value="New Artirealis inquiry">
          <input type="hidden" name="from_name" value="Artirealis website">
          <input type="checkbox" name="botcheck" class="honeypot" tabindex="-1" autocomplete="off">

          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" required></textarea>

          <button type="submit" id="submit-btn">Send</button>
        </form>
      </div>

      <div id="thank-you" hidden>
        <h2>Message received</h2>
        <p>I'll be in touch soon.</p>
      </div>
    </div>
  </div>

  <script>
    const trigger = document.getElementById('contact-trigger');
    const modal = document.getElementById('contact-modal');
    const closeBtn = document.getElementById('modal-close');
    const form = document.getElementById('contact-form');
    const formContainer = document.getElementById('form-container');
    const thankYou = document.getElementById('thank-you');
    const submitBtn = document.getElementById('submit-btn');

    function closeModal() {
      modal.hidden = true;
      formContainer.hidden = false;
      thankYou.hidden = true;
      form.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send';
    }

    trigger.addEventListener('click', () => { modal.hidden = false; });
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modal.hidden) closeModal();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          body: new FormData(form)
        });
        const data = await res.json();
        if (data.success) {
          formContainer.hidden = true;
          thankYou.hidden = false;
        } else {
          alert('Something went wrong. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send';
        }
      } catch (err) {
        alert('Network error. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
      }
    });
  </script>
</body>
</html>
